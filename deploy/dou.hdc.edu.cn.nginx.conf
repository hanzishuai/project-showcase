# Include this file inside nginx http {} (for example from sites-enabled).
# HTTPS endpoint :8000; backend must listen ONLY on 127.0.0.1:18000.
map $http_upgrade $dou_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8000 ssl;
    server_name dou.hdc.edu.cn;

    ssl_certificate     /etc/nginx/ssl/hdc.edu.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/hdc.edu.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Apply the same access gate to HTTP, SSE and WebSocket endpoints.
    auth_basic "Project Showcase";
    auth_basic_user_file /etc/nginx/auth/project-showcase.htpasswd;

    client_max_body_size 24m;
    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dou_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 240s;
    }
}
